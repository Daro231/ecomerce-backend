# ==============================================================================
# Production Profile Configuration for Railway Deployment
# Activated via: SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Server configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# ------------------------------------------------------------------------------
# Database Configuration (PostgreSQL)
# ------------------------------------------------------------------------------
# Railway provides either individual PG* environment variables or DATABASE_URL.
# If DB_URL is explicitly set (e.g. jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}),
# it will take precedence. Otherwise, it automatically maps Railway's PG* variables into
# a valid PostgreSQL JDBC URL.
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------------------
# Spring Boot Actuator (Healthcheck)
# ------------------------------------------------------------------------------
# Expose only /actuator/health for Railway's deployment zero-downtime healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ------------------------------------------------------------------------------
# Security & JWT
# ------------------------------------------------------------------------------
# In production, JWT secret must be provided via the JWT_SECRET environment variable
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Upload directory (mount a Railway volume or persistent storage)
app.upload-dir=${UPLOAD_DIR:/app/uploads}

# ------------------------------------------------------------------------------
# CORS Configuration
# ------------------------------------------------------------------------------
# FRONTEND_URL can be a single origin or comma-separated origins
# e.g.: https://frontend-production.up.railway.app,https://myshop.com
# Wildcards are strictly disabled in production
app.cors.allowed-origins=${FRONTEND_URL}
app.cors.allow-all=false

# ------------------------------------------------------------------------------
# Payment & KHQR Configuration
# ------------------------------------------------------------------------------
payment.khqr.mode=${KHQR_MODE:mock}
payment.khqr.expiry-minutes=${KHQR_EXPIRY_MINUTES:10}
payment.khqr.poll-interval-ms=${KHQR_POLL_INTERVAL_MS:5000}
payment.khqr.expiry-grace-minutes=${KHQR_EXPIRY_GRACE_MINUTES:5}
payment.khqr.min-check-interval-seconds=${KHQR_MIN_CHECK_INTERVAL_SECONDS:3}
payment.khqr.auto-cancel-minutes=${KHQR_AUTO_CANCEL_MINUTES:30}
payment.khqr.auto-cancel-check-interval-ms=${KHQR_AUTO_CANCEL_CHECK_INTERVAL_MS:60000}
payment.khqr.late-payment-watch-hours=${KHQR_LATE_PAYMENT_WATCH_HOURS:24}
payment.khqr.late-payment-check-interval-ms=${KHQR_LATE_PAYMENT_CHECK_INTERVAL_MS:60000}

# ------------------------------------------------------------------------------
# Bakong API Configuration (used when KHQR_MODE=bakong)
# ------------------------------------------------------------------------------
bakong.base-url=${BAKONG_BASE_URL:https://api-bakong.nbc.gov.kh}
bakong.token=${BAKONG_TOKEN:}
bakong.account-id=${BAKONG_ACCOUNT_ID:}
bakong.merchant-name=${BAKONG_MERCHANT_NAME:ECOM Computer Store}
bakong.merchant-city=${BAKONG_MERCHANT_CITY:Phnom Penh}
bakong.currency=${BAKONG_CURRENCY:USD}
bakong.khr-per-usd=${BAKONG_KHR_PER_USD:4100}
bakong.store-label=${BAKONG_STORE_LABEL:ECOM}
bakong.terminal-label=${BAKONG_TERMINAL_LABEL:WEB}
bakong.connect-timeout-ms=5000
bakong.read-timeout-ms=10000
